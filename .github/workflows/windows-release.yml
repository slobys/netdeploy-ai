name: Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build self-contained installer
        run: python packaging/windows/build.py
      - name: Verify installation, upgrade and uninstall
        shell: powershell
        run: |
          ./packaging/windows/verify.ps1 -Installer (Resolve-Path 'release/NetDeployAI-0.3.38-Setup-x64.exe').Path -Python (Get-Command python.exe).Source
      - uses: actions/upload-artifact@v4
        with:
          name: NetDeployAI-windows-x64
          path: release/*
      - name: Publish verified Windows downloads
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/* --verify-tag --title "NetDeploy AI $env:GITHUB_REF_NAME" --notes-file packaging/windows/RELEASE.md
