name: NetDeploy AI online handbook

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "scripts/gcp-root-setup.sh"
      - "tests/docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "scripts/gcp-root-setup.sh"
      - "tests/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package public handbook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify handbook, links and GCP root helper
        run: |
          python3 -m unittest discover -s tests/docs -p "test_*.py"
          python3 docs/site/build.py
          bash -n scripts/gcp-root-setup.sh
      - name: Upload strictly scoped documentation files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/docs-site

  deploy:
    name: Publish handbook to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
