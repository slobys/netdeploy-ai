<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body data-page="$page_id">
  <a class="skip-link" href="#content">跳转到正文</a>
  <header class="header">
    <a href="index.html" class="brand" aria-label="NetDeploy AI 文档首页">
      <span class="brand-icon" aria-hidden="true">N<span>D</span></span>
      <span class="brand-name">NetDeploy <strong>AI</strong><small>使用手册</small></span>
    </a>
    <button type="button" class="search-trigger" data-search-open aria-keyshortcuts="Control+K Meta+K">⌕ <span>搜索文档</span><kbd>Ctrl K</kbd></button>
    <nav class="top-links" aria-label="快捷入口">
      <a href="quick-start.html">快速开始</a>
      <a href="https://github.com/slobys/netdeploy-ai" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
    <button type="button" id="theme-toggle" class="icon-button" aria-label="切换主题" aria-pressed="false">◐</button>
    <button type="button" id="menu-toggle" class="menu-button" aria-controls="sidebar" aria-expanded="false">☰ 目录</button>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="文档目录">
      <nav>$navigation</nav>
      <div class="sidebar-foot"><span class="version">v$version · Alpha</span><a href="https://github.com/slobys/netdeploy-ai/issues">反馈问题 ↗</a></div>
    </aside>
    <main id="content" tabindex="-1">
      <article class="article">
        <div class="page-heading"><div class="eyebrow">NETDEPLOY AI / HANDBOOK</div><h1>$page_title</h1><p class="lead">$page_description</p></div>
        $content
        <nav class="pager" aria-label="相邻文档">$pager</nav>
        <footer class="article-foot"><span>NetDeploy AI · 当前为 Alpha 测试阶段</span><a href="security.html">安全与限制</a></footer>
      </article>
    </main>
    <aside class="toc" aria-label="本页目录"><div class="toc-title">本页目录</div>$toc<a class="toc-top" href="#content">↑ 返回顶部</a></aside>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="search-head"><label id="search-title" for="search-input">搜索文档</label><button id="search-close" type="button" class="icon-button" aria-label="关闭搜索">✕</button></div>
    <input type="search" id="search-input" placeholder="试试 SSH、谷歌云 root、端口、证书…" autocomplete="off">
    <p id="search-status" role="status" aria-live="polite">输入关键词查找步骤</p>
    <div id="search-results" aria-label="搜索结果"></div>
    <p class="search-foot">↑ ↓ 切换 · Enter 打开 · Esc 关闭 · 本地搜索，不上传输入内容</p>
  </dialog>
  <noscript><div class="noscript">无需 JavaScript 也可阅读目录和正文；搜索、复制命令和主题切换需要启用 JavaScript。</div></noscript>
</body>
</html>
